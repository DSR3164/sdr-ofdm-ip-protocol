name: SDR Wireless Tunnel CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - uhd

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  CCACHE_DIR: ~/.cache/ccache

jobs:
  filter:
    name: Check Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'include/**'
              - 'CMakeLists.txt'
              - 'config/**'
              - '.github/workflows/ci.yaml'

  clang-format:
    name: Format Check
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt update
          sudo apt install -y clang-format-18

      - name: Check formatting
        run: |
          find src include \
            \( -name "*.cpp" -o -name "*.hpp" \) \
            | xargs clang-format-18 -i
          git diff --name-only --exit-code

  build-gcc:
    name: Build (GCC Release)
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            gcc-14 \
            g++-14 \
            libfftw3-dev \
            libsdl2-dev \
            libglew-dev \
            libsoapysdr-dev \
            libuhd-dev \
            uhd-host \
            libopengl-dev

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gcc-${{ github.sha }}
          restore-keys: ccache-gcc-

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -B $BUILD_DIR \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build $BUILD_DIR -j$(nproc)

      - name: ccache stats
        run: |
          ccache -s

  build-clang:
    name: Build (Clang Debug) + clang-tidy
    needs: filter
    if: needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang-18 \
            clang-tidy-18 \
            cmake \
            ninja-build \
            ccache \
            libfftw3-dev \
            libsdl2-dev \
            libglew-dev \
            libsoapysdr-dev \
            libuhd-dev \
            uhd-host \
            libopengl-dev

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-clang-${{ github.sha }}
          restore-keys: ccache-clang-

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          cmake -B $BUILD_DIR \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cmake --build $BUILD_DIR -j$(nproc)

      - name: Run clang-tidy
        run: |
          find src include \
            \( -name "*.cpp" -o -name "*.hpp" \) \
            | xargs -P $(nproc) clang-tidy-18 \
                -p $BUILD_DIR

      - name: ccache stats
        run: |
          ccache -s
